# 1Agents OTA mirror — static release files at agents-ota.dreammate.work
# Serves /var/www/1agents/releases/{manifest.json,<version>/<artifacts>}.
# The :443 block + http->https redirect are injected by `certbot --nginx`.
server {
    listen 80;
    server_name agents-ota.dreammate.work;

    access_log off;
    error_log  /var/log/nginx/agents_ota_error.log;

    root /var/www/1agents/releases;

    # Latest-version pointer — never cache so clients always see new releases.
    location = /manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Release archives / installers — force download semantics.
    location ~* \.(tar\.gz|tgz|zip|exe|msi|dmg|AppImage|deb)$ {
        add_header Content-Type application/octet-stream always;
    }

    location / {
        autoindex off;
    }
}

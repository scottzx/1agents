# 训记 (Xunji) 训练数据连接器 — 声明式 REST 源示例。
# 用法: cp 本文件到 ~/.1agents/connectors/xunji.yaml，重启后端即注册；
# 然后在「数据源」里为 xunji 填入 Bearer token（PUT /api/sources/xunji/bearer）。
# 只读接入；写回(api_upsert)是带确认的 agent 动作，走 skill 层，不在连接器内。
vendor: xunji
label: 训记
region: cn
multiAccount: false
authKind: bearer
baseUrl: https://trains.xunjiapp.cn
collections:
  - kind: xunji_train
    domain: fitness
    label: 训练记录
    method: POST
    endpoint: /api_trains_for_llm_v2
    # 常量 JSON body（typed —— include_full_data 保持布尔）。datestr 由 date-window 游标注入。
    body:
      schema_version: train_open_api_v2
      include_full_data: false
    auth:
      scheme: bearer
      headerName: Authorization
      prefix: "Bearer "
    # 注:真实响应无顶层 success 字段(HTTP 200 + res 即成功),故不设 successPath。
    itemPath: res.trains        # 训练数组
    uidField: localid           # 稳定外部 id (数值,连接器按字面量取字符串)
    cursor:
      flavor: date-window       # 按 datestr 从 today-lookback 遍历到 today，逐日一请求
      dateParam: datestr
      dateLayout: "2006-01-02"
      lookbackDays: 30
      minIntervalSeconds: 2     # 限频，防 too frequent（读 15s 一次，这里留足余量）
    defaults:
      enabled: true
      incrementalMinutes: 720   # 每 12h 增量
      pageSize: 0
      initialLookbackDays: 30
    # 通用 bronze→silver 落地：整存 payload + 把这些 JSON 路径提成列，查看器直接渲染。
    silver:
      table: silver_xunji
      domain: fitness
      promote:
        title: title
        datestr: datestr

# silver→gold 声明式 SQL 步骤（全在 data.db,不需 ATTACH）。这一步是 1:1 投影:
# 从 silver_xunji 的 payload JSON 抽出动作数/时长成结构化 gold 列。多前项表时在
# body 里 join 即可(runner 不关心 join 结构)。cursor 增量 + ON CONFLICT upsert 幂等。
governance:
  - name: gold_xunji_train
    upstreams: [silver_xunji]
    output: gold_xunji_train
    domain: fitness
    incremental: { table: silver_xunji, column: updated_at }
    createSQL: |
      CREATE TABLE IF NOT EXISTS gold_xunji_train (
        source TEXT NOT NULL DEFAULT 'xunji',
        external_id TEXT NOT NULL,
        datestr TEXT NOT NULL DEFAULT '',
        title TEXT NOT NULL DEFAULT '',
        movements INTEGER NOT NULL DEFAULT 0,
        duration_s INTEGER NOT NULL DEFAULT 0,
        updated_at INTEGER NOT NULL DEFAULT 0,
        PRIMARY KEY (external_id)
      );
    body: |
      INSERT INTO gold_xunji_train
        (source, external_id, datestr, title, movements, duration_s, updated_at)
      SELECT 'xunji', external_id, datestr, title,
             COALESCE(json_array_length(json_extract(payload, '$.movements')), 0),
             CAST((COALESCE(json_extract(payload, '$.end'), 0)
                 - COALESCE(json_extract(payload, '$.start'), 0)) / 1000 AS INTEGER),
             updated_at
      FROM silver_xunji
      WHERE updated_at > :since
      ON CONFLICT(external_id) DO UPDATE SET
        datestr=excluded.datestr, title=excluded.title,
        movements=excluded.movements, duration_s=excluded.duration_s,
        updated_at=excluded.updated_at;

  # Python 脚本步骤(SQL 够不着的嵌套数组聚合):遍历 movements[].sets[] 累加
  # 已完成组的 weight*reps 得每次训练总容量。inputSQL 选行→脚本→upsert 到 output。
  # 脚本需与本 manifest 一起放进 ~/.1agents/connectors/(相对该目录解析)。
  - name: gold_xunji_volume
    upstreams: [silver_xunji]
    output: gold_xunji_volume
    domain: fitness
    script: scripts/xunji_volume.py
    interpreter: python3
    inputSQL: SELECT external_id, datestr, payload, updated_at FROM silver_xunji WHERE updated_at > :since
    incremental: { table: silver_xunji, column: updated_at }
    conflict: [external_id]
    createSQL: |
      CREATE TABLE IF NOT EXISTS gold_xunji_volume (
        source TEXT NOT NULL DEFAULT 'xunji',
        external_id TEXT NOT NULL,
        datestr TEXT NOT NULL DEFAULT '',
        total_volume_kg REAL NOT NULL DEFAULT 0,
        total_sets INTEGER NOT NULL DEFAULT 0,
        updated_at INTEGER NOT NULL DEFAULT 0,
        PRIMARY KEY (external_id)
      );

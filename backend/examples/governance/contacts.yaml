# 跨源联系人并集 —— 独立治理声明(与连接器解耦)。
# 用法: cp contacts.yaml + scripts/ 到 ~/.1agents/governance/,重启后端即生效。
# 三张实体表: silver_icloud_contacts(苹果,现成) / gold_feishu_contacts(飞书并集)
#           / unified_contacts(苹果 ∪ 飞书)。步骤读 data.db 任意表,无关来自哪个源。
name: contacts
steps:
  # ① 飞书用户列表 = 二级用户(已含直接联系人+群成员+群消息发送者) ∪ 群消息里
  #    尚未收录的发送者(兜底提取剩余用户)。全量重算(省略 incremental):并集/去重
  #    语义下按 open_id 幂等 upsert,联系人规模成本可忽略。
  - name: gold_feishu_contacts
    source: feishu
    domain: contacts
    output: gold_feishu_contacts
    upstreams: [silver_feishu_users, silver_feishu_messages]
    createSQL: |
      CREATE TABLE IF NOT EXISTS gold_feishu_contacts (
        source TEXT NOT NULL DEFAULT 'feishu',
        external_id TEXT NOT NULL,
        name TEXT NOT NULL DEFAULT '',
        updated_at INTEGER NOT NULL DEFAULT 0,
        PRIMARY KEY (external_id)
      );
    body: |
      INSERT INTO gold_feishu_contacts (source, external_id, name, updated_at)
      SELECT 'feishu', external_id, name, updated_at
        FROM silver_feishu_users WHERE deleted = 0
      UNION
      SELECT 'feishu', sender_open_id, '', 0
        FROM silver_feishu_messages
        WHERE sender_open_id <> ''
          AND sender_open_id NOT IN (SELECT external_id FROM silver_feishu_users WHERE deleted = 0)
      ON CONFLICT(external_id) DO UPDATE SET
        name = CASE WHEN excluded.name <> '' THEN excluded.name ELSE gold_feishu_contacts.name END,
        updated_at = MAX(excluded.updated_at, gold_feishu_contacts.updated_at);

  # ② 并集联系人 = 苹果 ∪ 飞书,按规范化手机号合并同一人(手机号规范化脏,走 Python)。
  #    inputSQL 把两源拼成统一输入喂脚本;脚本内存分组后按 entity_key upsert。
  #    upstreams 含 gold_feishu_contacts → topo 保证 ② 在 ① 之后跑。
  - name: unified_contacts
    source: unified
    domain: contacts
    output: unified_contacts
    upstreams: [silver_icloud_contacts, gold_feishu_contacts]
    script: scripts/contacts_unify.py
    conflict: [entity_key]
    inputSQL: |
      SELECT 'apple' AS src, external_id, full_name AS name, phones
        FROM silver_icloud_contacts WHERE deleted = 0
      UNION ALL
      SELECT 'feishu' AS src, external_id, name AS name, '[]' AS phones
        FROM gold_feishu_contacts
    createSQL: |
      CREATE TABLE IF NOT EXISTS unified_contacts (
        entity_key TEXT NOT NULL,
        external_id TEXT NOT NULL DEFAULT '',
        source TEXT NOT NULL DEFAULT 'unified',
        name TEXT NOT NULL DEFAULT '',
        sources TEXT NOT NULL DEFAULT '[]',
        phones TEXT NOT NULL DEFAULT '[]',
        apple_ids TEXT NOT NULL DEFAULT '[]',
        feishu_open_ids TEXT NOT NULL DEFAULT '[]',
        source_count INTEGER NOT NULL DEFAULT 0,
        updated_at INTEGER NOT NULL DEFAULT 0,
        PRIMARY KEY (entity_key)
      );

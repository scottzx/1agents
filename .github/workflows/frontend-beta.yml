name: frontend-beta

# Publishes a DEV/BETA frontend bundle as a GitHub *prerelease* on a rolling
# tag (frontend-beta), consumed only by agent-dev.dreammate.work.
#
# Why a GitHub prerelease instead of COS: the runner uploads to GitHub on its
# own network (fast — no UserNetworkTooSlow like the trans-pacific COS upload),
# and the China VPS pulls the asset through a gh-proxy file-acceleration mirror
# (direct github.com is blocked from that host). This is NOT a formal release —
# it is a prerelease, kept off the stable channel entirely.
#
# Isolated from the stable pipeline (auto-release.yml / ota-cdn-publish.yml):
# its own version line (v{date}.beta.N), its own rolling prerelease tag, its own
# assets (manifest.json + frontend-{version}.tar.gz). The manifest carries NO
# backend binaries, so the dev server's backend self-update stays a no-op.
#
# VPS side: server-h5-ota-dev.sh reads
#   {gh-proxy}/https://github.com/<repo>/releases/download/frontend-beta/manifest.json
# and downloads the tarball the same way.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-beta.yml"
  workflow_dispatch:

# Rolling "latest beta": newest push wins, cancel any superseded in-flight run.
concurrency:
  group: frontend-beta
  cancel-in-progress: true

permissions:
  contents: write  # create/update the prerelease

env:
  BETA_TAG: frontend-beta

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compute beta version (v{date}.beta.N)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # N is the per-day counter. Derive it from the version currently
          # published on the rolling prerelease (one manifest read on the runner,
          # direct to GitHub = fast). Same day → +1, new day or none → 1.
          DATE=$(date -u +%Y%m%d)
          rm -rf /tmp/curbeta && mkdir -p /tmp/curbeta
          CUR=""
          if gh release download "$BETA_TAG" --repo "${{ github.repository }}" \
               --pattern manifest.json --dir /tmp/curbeta 2>/dev/null; then
            CUR=$(python3 -c "import json;print(json.load(open('/tmp/curbeta/manifest.json'))['components']['frontend']['version'])" 2>/dev/null || echo "")
          fi
          if [[ "$CUR" == v${DATE}.beta.* ]]; then
            N=$(( ${CUR##*.} + 1 ))
          else
            N=1
          fi
          echo "version=v${DATE}.beta.${N}" >> "$GITHUB_OUTPUT"
          echo "Computed beta version: v${DATE}.beta.${N} (previous: ${CUR:-none})"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/.yarn/cache
            frontend/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Build frontend (beta version baked in)
        working-directory: frontend
        env:
          # Baked into __APP_VERSION__ via webpack DefinePlugin so the running
          # dev frontend knows its own version and the OTA checker compares right.
          APP_VERSION: ${{ steps.version.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          corepack enable
          yarn install
          yarn build

      - name: Stage bundle + build beta manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _stage
          # Files at top level so the server updater can swap dist/ directly.
          tar -czf "_stage/frontend-${VERSION}.tar.gz" -C frontend/dist .
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          ver = os.environ["VERSION"]
          repo = os.environ["REPO"]
          tar = f"_stage/frontend-{ver}.tar.gz"
          sha = hashlib.sha256(open(tar, "rb").read()).hexdigest()
          # Plain GitHub asset URL (proxy-agnostic). The VPS prepends its own
          # gh-proxy prefix; backend.platforms is empty → no backend self-update.
          entry = f"https://github.com/{repo}/releases/download/frontend-beta/frontend-{ver}.tar.gz"
          m = {
              "channel": "beta",
              "released_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "min_supported": "0.0.0",
              "manifest_version": 1,
              "components": {
                  "frontend": {"version": ver, "entry": entry, "integrity": f"sha256-{sha}"},
                  "backend": {"version": ver, "platforms": {}},
              },
              "previous": [],
          }
          json.dump(m, open("_stage/manifest.json", "w"), indent=2)
          print(json.dumps(m, indent=2))
          PY

      - name: Publish GitHub prerelease (rolling frontend-beta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Create the rolling prerelease once; thereafter clobber its assets.
          # No delete-then-create, so there is never a window with no release.
          gh release create "$BETA_TAG" --repo "$REPO" --prerelease \
            --target "${{ github.sha }}" \
            --title "Frontend Beta (rolling latest — NOT a stable release)" \
            --notes "agent-dev 前端最新 dev 构建,滚动更新。由 server-h5-ota-dev.sh 经 gh-proxy 拉取。非正式 release。" \
            2>/dev/null || true
          gh release upload "$BETA_TAG" --repo "$REPO" --clobber \
            "_stage/manifest.json" "_stage/frontend-${VERSION}.tar.gz"
          # Prune older frontend-*.tar.gz assets, keep only the current one.
          gh release view "$BETA_TAG" --repo "$REPO" --json assets -q '.assets[].name' \
            | grep -E '^frontend-.*\.tar\.gz$' | grep -vx "frontend-${VERSION}.tar.gz" \
            | while read -r a; do gh release delete-asset "$BETA_TAG" "$a" --repo "$REPO" --yes 2>/dev/null || true; done
          echo "Published $VERSION to prerelease $BETA_TAG"

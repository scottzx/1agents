name: auto-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      npm_version: ${{ steps.version.outputs.npm_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Calculate next version tag
        id: version
        run: |
          DATE_STR=$(date +'%Y%m%d')
          echo "Current date: $DATE_STR"
          
          git fetch --tags --force
          
          TAGS=$(git tag -l "v${DATE_STR}-*")
          if [ -z "$TAGS" ]; then
            NEXT_NO=1
          else
            MAX_NO=$(echo "$TAGS" | sed "s/^v${DATE_STR}-//" | sort -n | tail -n 1)
            NEXT_NO=$((MAX_NO + 1))
          fi
          
          TAG="v${DATE_STR}-${NEXT_NO}"
          NPM_VERSION="${DATE_STR}.${NEXT_NO}.0"
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          
          echo "Calculated Tag: $TAG"
          echo "Calculated NPM Version: $NPM_VERSION"

      - name: Create and push Git tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

  build-frontend:
    runs-on: ubuntu-latest
    # Wait for prepare so APP_VERSION is the release tag (not a short SHA from
    # shallow git describe). OTA version compare relies on vYYYYMMDD-N.
    needs: [prepare]
    steps:
      - uses: actions/checkout@v6
        with:
          # HarnessKit + cc-connect web sources needed for embed ESM bundles
          submodules: recursive

      - name: Cache Frontend Build Assets
        id: cache-frontend
        uses: actions/cache@v6
        with:
          path: |
            frontend/dist
            modules/ttyd/src/html.h
          # Include embed entrypoints so HarnessKit/cc-connect panel UI rebuilds when they change.
          # Bump version in the key so each release tag gets a versioned bundle.
          key: frontend-assets-${{ runner.os }}-${{ needs.prepare.outputs.tag }}-${{ hashFiles('frontend/package.json', 'frontend/yarn.lock', 'frontend/gulpfile.js', 'frontend/webpack.config.js', 'frontend/tsconfig.json', 'frontend/src/**', 'scripts/build-module-embeds.sh', 'modules/HarnessKit/package.json', 'modules/HarnessKit/package-lock.json', 'modules/HarnessKit/vite.config.ts', 'modules/HarnessKit/src/embed.tsx', 'modules/HarnessKit/src/embed/**', 'modules/cc-connect/web/package.json', 'modules/cc-connect/web/vite.embed.config.ts', 'modules/cc-connect/web/src/embed.tsx') }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache Yarn dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            frontend/.yarn/cache
            frontend/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install and Build Frontend
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: frontend
        env:
          # webpack DefinePlugin → __APP_VERSION__ (frontend/src/version.ts)
          APP_VERSION: ${{ needs.prepare.outputs.tag }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: |
          corepack enable
          yarn install
          yarn build

      # Embeds are served from StaticDir/embed/ via /api/embed/* — not webpack-bundled.
      # Always ensure they exist (covers cache hits that predate this step).
      - name: Build and stage module embeds
        run: |
          if [ ! -f frontend/dist/embed/harnesskit/index.html ] || [ ! -f frontend/dist/embed/cc-connect-embed.js ]; then
            FORCE_EMBED_REBUILD=1 ./scripts/build-module-embeds.sh
          else
            echo "embed bundles already present under frontend/dist/embed/"
            ls -la frontend/dist/embed/
          fi
          # HarnessKit ships as a static SPA staged under embed/harnesskit/
          # (no ESM embed bundle yet — see scripts/build-module-embeds.sh).
          test -d frontend/dist/embed/harnesskit
          test -s frontend/dist/embed/harnesskit/index.html
          test -s frontend/dist/embed/cc-connect-embed.js

      - name: Audit HarnessKit frontend artifacts
        run: ./scripts/check-harnesskit-artifacts.sh frontend/dist

      - name: Upload frontend/dist
        uses: actions/upload-artifact@v7
        with:
          name: html-dist
          path: frontend/dist

      - name: Upload html.h
        uses: actions/upload-artifact@v7
        with:
          name: html-header
          path: modules/ttyd/src/html.h

  build-linux:
    runs-on: ${{ matrix.runner }}
    needs: [prepare, build-frontend]
    strategy:
      matrix:
        include:
          - arch: amd64
            target: amd64
            goarch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: |
            backend/go.sum
            modules/cc-connect/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download html-dist artifact
        uses: actions/download-artifact@v8
        with:
          name: html-dist
          path: html-dist

      - name: Download html.h artifact
        uses: actions/download-artifact@v8
        with:
          name: html-header
          path: temp-html-header

      - name: Copy html.h to modules/ttyd/src/
        run: |
          if [ -f temp-html-header/modules/ttyd/src/html.h ]; then
            cp temp-html-header/modules/ttyd/src/html.h modules/ttyd/src/html.h
          elif [ -f temp-html-header/src/html.h ]; then
            cp temp-html-header/src/html.h modules/ttyd/src/html.h
          elif [ -f temp-html-header/html.h ]; then
            cp temp-html-header/html.h modules/ttyd/src/html.h
          else
            echo "html.h not found!"
            find temp-html-header -type f
            exit 1
          fi

      - name: Cache cross-compilation stage
        uses: actions/cache@v6
        with:
          path: |
            /opt/cross
            /opt/stage
          key: cross-stage-${{ matrix.target }}-${{ hashFiles('scripts/cross-build.sh') }}
          restore-keys: |
            cross-stage-${{ matrix.target }}-

      - name: Install cross-build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool

      - name: Build static ttyd
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: ./scripts/cross-build.sh

      - name: Cache cc-connect Web Assets
        id: cache-ccconnect-web
        uses: actions/cache@v6
        with:
          path: modules/cc-connect/web/dist
          key: cc-connect-web-${{ runner.os }}-${{ hashFiles('modules/cc-connect/web/package.json', 'modules/cc-connect/web/pnpm-lock.yaml', 'modules/cc-connect/web/src/**', 'modules/cc-connect/web/index.html', 'modules/cc-connect/web/vite.config.ts', 'modules/cc-connect/web/tailwind.config.ts', 'modules/cc-connect/web/postcss.config.js') }}

      - name: Cache pnpm
        if: steps.cache-ccconnect-web.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('modules/cc-connect/web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Build cc-connect Web Assets
        if: steps.cache-ccconnect-web.outputs.cache-hit != 'true'
        run: |
          npm install -g pnpm
          cd modules/cc-connect/web
          pnpm install --frozen-lockfile --dangerously-allow-all-builds
          pnpm build

      - name: Build Go 1agents
        run: |
          cd backend
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../build/1agents ./cmd/backend
          cd ../modules/cc-connect/cmd/cc-connect
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../../../../build/cc-connect .

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.rust_target }}-${{ hashFiles('modules/HarnessKit/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.rust_target }}-

      - name: Build HarnessKit frontend (embedded into hk CLI)
        run: |
          cd modules/HarnessKit
          npm ci --ignore-scripts
          npm run build

      - name: Build HarnessKit CLI
        run: |
          cargo build \
            --manifest-path modules/HarnessKit/Cargo.toml \
            --release \
            --target ${{ matrix.rust_target }} \
            -p hk-cli
          cp modules/HarnessKit/target/${{ matrix.rust_target }}/release/hk build/hk

      # cloudflared is optional: tunnel supervisor downloads it on demand
      # (PATH → ~/.1agents/bin → GitHub releases). Not shipped in the archive.

      - name: Build happy bundle
        run: ./scripts/build-happy-bundle.sh
        # Default: omit happy-cli node_modules (installed at npm postinstall / first launch)

      - name: Package Release Archive (optional non-npm bypass)
        run: |
          mkdir -p release-pkg/bin release-pkg/config
          cp build/1agents release-pkg/bin/
          cp build/ttyd release-pkg/bin/
          cp build/cc-connect release-pkg/bin/
          cp build/hk release-pkg/bin/
          cp build/happy release-pkg/bin/
          cp -r build/happy-cli release-pkg/bin/happy-cli
          cp -r build/adapter release-pkg/bin/adapter
          cp -r html-dist release-pkg/dist
          cp config/agent-extension-map.json release-pkg/config/
          ./scripts/stage-harnesskit-compliance.sh release-pkg/licenses
          tar -czf 1agents-${{ needs.prepare.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz -C release-pkg .
          ./scripts/check-harnesskit-artifacts.sh 1agents-${{ needs.prepare.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz

      - name: Fill npm packages for this platform
        env:
          NPM_PLAT: ${{ matrix.arch == 'amd64' && 'linux-x64' || 'linux-arm64' }}
          CORE_BIN_DIR: ${{ github.workspace }}/build
          WEB_DIST: ${{ github.workspace }}/html-dist
          HAPPY_OUT: ${{ github.workspace }}/build
        run: ./scripts/npm-fill-packages.sh

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v7
        with:
          name: 1agents-linux-${{ matrix.arch }}
          path: 1agents-${{ needs.prepare.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz

      - name: Upload npm packages (linux platform binaries)
        uses: actions/upload-artifact@v7
        with:
          name: npm-pkgs-linux-${{ matrix.arch }}
          path: |
            npm/packages/core-${{ matrix.arch == 'amd64' && 'linux-x64' || 'linux-arm64' }}
            npm/packages/cc-connect-${{ matrix.arch == 'amd64' && 'linux-x64' || 'linux-arm64' }}
            npm/packages/web
            npm/packages/happy
            npm/packages/acpx
            npm/packages/acp-bridge
            npm/packages/cli
            npm/packages/cc-connect

  build-macos:
    runs-on: macos-latest
    needs: [prepare, build-frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: |
            backend/go.sum
            modules/cc-connect/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download html-dist artifact
        uses: actions/download-artifact@v8
        with:
          name: html-dist
          path: html-dist

      - name: Download html.h artifact
        uses: actions/download-artifact@v8
        with:
          name: html-header
          path: temp-html-header

      - name: Copy html.h to modules/ttyd/src/
        run: |
          if [ -f temp-html-header/modules/ttyd/src/html.h ]; then
            cp temp-html-header/modules/ttyd/src/html.h modules/ttyd/src/html.h
          elif [ -f temp-html-header/src/html.h ]; then
            cp temp-html-header/src/html.h modules/ttyd/src/html.h
          elif [ -f temp-html-header/html.h ]; then
            cp temp-html-header/html.h modules/ttyd/src/html.h
          else
            echo "html.h not found!"
            find temp-html-header -type f
            exit 1
          fi

      - name: Install build dependencies via Homebrew
        run: brew install cmake libuv json-c openssl libwebsockets

      - name: Build ttyd natively
        run: |
          mkdir build-ttyd && cd build-ttyd
          cmake -DCMAKE_PREFIX_PATH="/opt/homebrew;/usr/local" -DCMAKE_BUILD_TYPE=Release ../modules/ttyd
          make

      - name: Cache cc-connect Web Assets
        id: cache-ccconnect-web
        uses: actions/cache@v6
        with:
          path: modules/cc-connect/web/dist
          key: cc-connect-web-${{ runner.os }}-${{ hashFiles('modules/cc-connect/web/package.json', 'modules/cc-connect/web/pnpm-lock.yaml', 'modules/cc-connect/web/src/**', 'modules/cc-connect/web/index.html', 'modules/cc-connect/web/vite.config.ts', 'modules/cc-connect/web/tailwind.config.ts', 'modules/cc-connect/web/postcss.config.js') }}

      - name: Cache pnpm
        if: steps.cache-ccconnect-web.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('modules/cc-connect/web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Build cc-connect Web Assets
        if: steps.cache-ccconnect-web.outputs.cache-hit != 'true'
        run: |
          npm install -g pnpm
          cd modules/cc-connect/web
          pnpm install --frozen-lockfile --dangerously-allow-all-builds
          pnpm build

      - name: Build Go 1agents
        run: |
          cd backend
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../build-ttyd/1agents ./cmd/backend
          cd ../modules/cc-connect/cmd/cc-connect
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../../../../build-ttyd/cc-connect .

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-darwin-arm64-${{ hashFiles('modules/HarnessKit/Cargo.lock') }}
          restore-keys: |
            cargo-darwin-arm64-

      - name: Build HarnessKit frontend (embedded into hk CLI)
        run: |
          cd modules/HarnessKit
          npm ci --ignore-scripts
          npm run build

      - name: Build HarnessKit CLI
        run: |
          cargo build \
            --manifest-path modules/HarnessKit/Cargo.toml \
            --release \
            -p hk-cli
          cp modules/HarnessKit/target/release/hk build-ttyd/hk

      - name: Build happy bundle
        run: ./scripts/build-happy-bundle.sh "$PWD/build-ttyd"

      - name: Package Release Archive (optional non-npm bypass)
        run: |
          mkdir -p release-pkg/bin release-pkg/config
          cp build-ttyd/1agents release-pkg/bin/
          cp build-ttyd/ttyd release-pkg/bin/
          cp build-ttyd/cc-connect release-pkg/bin/
          cp build-ttyd/hk release-pkg/bin/
          cp build-ttyd/happy release-pkg/bin/
          cp -r build-ttyd/happy-cli release-pkg/bin/happy-cli
          cp -r build-ttyd/adapter release-pkg/bin/adapter
          cp -r html-dist release-pkg/dist
          cp config/agent-extension-map.json release-pkg/config/
          ./scripts/stage-harnesskit-compliance.sh release-pkg/licenses
          tar -czf 1agents-${{ needs.prepare.outputs.tag }}-darwin-arm64.tar.gz -C release-pkg .
          ./scripts/check-harnesskit-artifacts.sh 1agents-${{ needs.prepare.outputs.tag }}-darwin-arm64.tar.gz

      - name: Fill npm packages (darwin-arm64)
        env:
          NPM_PLAT: darwin-arm64
          CORE_BIN_DIR: ${{ github.workspace }}/build-ttyd
          WEB_DIST: ${{ github.workspace }}/html-dist
          HAPPY_OUT: ${{ github.workspace }}/build-ttyd
        run: ./scripts/npm-fill-packages.sh

      - name: Upload macOS Archive
        uses: actions/upload-artifact@v7
        with:
          name: 1agents-darwin-arm64
          path: 1agents-${{ needs.prepare.outputs.tag }}-darwin-arm64.tar.gz

      - name: Upload npm packages (darwin-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: npm-pkgs-darwin-arm64
          path: |
            npm/packages/core-darwin-arm64
            npm/packages/cc-connect-darwin-arm64
            npm/packages/web
            npm/packages/happy
            npm/packages/acpx
            npm/packages/acp-bridge
            npm/packages/cli
            npm/packages/cc-connect

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_name: macos
          - platform: windows-latest
            os_name: windows
    runs-on: ${{ matrix.platform }}
    needs: [prepare, build-frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: |
            backend/go.sum
            modules/cc-connect/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download html-dist artifact
        uses: actions/download-artifact@v8
        with:
          name: html-dist
          path: frontend/dist

      - name: Download html.h artifact
        uses: actions/download-artifact@v8
        with:
          name: html-header
          path: temp-html-header

      - name: Copy html.h to modules/ttyd/src/
        shell: bash
        run: |
          if [ -f temp-html-header/modules/ttyd/src/html.h ]; then
            cp temp-html-header/modules/ttyd/src/html.h modules/ttyd/src/html.h
          elif [ -f temp-html-header/src/html.h ]; then
            cp temp-html-header/src/html.h modules/ttyd/src/html.h
          elif [ -f temp-html-header/html.h ]; then
            cp temp-html-header/html.h modules/ttyd/src/html.h
          else
            echo "html.h not found!"
            find temp-html-header -type f
            exit 1
          fi

      - name: Cache cc-connect Web Assets
        id: cache-ccconnect-web
        uses: actions/cache@v6
        with:
          path: modules/cc-connect/web/dist
          key: cc-connect-web-${{ runner.os }}-${{ hashFiles('modules/cc-connect/web/package.json', 'modules/cc-connect/web/pnpm-lock.yaml', 'modules/cc-connect/web/src/**', 'modules/cc-connect/web/index.html', 'modules/cc-connect/web/vite.config.ts', 'modules/cc-connect/web/tailwind.config.ts', 'modules/cc-connect/web/postcss.config.js') }}

      - name: Build cc-connect Web Assets
        if: steps.cache-ccconnect-web.outputs.cache-hit != 'true'
        shell: bash
        run: |
          npm install -g pnpm
          cd modules/cc-connect/web
          pnpm install --frozen-lockfile --dangerously-allow-all-builds
          pnpm build

      - name: Build macOS binaries
        if: matrix.os_name == 'macos'
        run: |
          brew install cmake libuv json-c openssl libwebsockets
          mkdir build-ttyd && cd build-ttyd
          cmake -DCMAKE_PREFIX_PATH="/opt/homebrew;/usr/local" -DCMAKE_BUILD_TYPE=Release ../modules/ttyd
          make
          cd ..
          mkdir -p build
          cp build-ttyd/ttyd build/ttyd
          
          # Build Go binaries
          cd backend
          go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../build/1agents ./cmd/backend
          cd ../modules/cc-connect/cmd/cc-connect
          go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../../../../build/cc-connect .

      - name: Cache vcpkg packages (Windows)
        if: matrix.os_name == 'windows'
        uses: actions/cache@v6
        with:
          path: C:/vcpkg/installed
          key: vcpkg-windows-ttyd-${{ hashFiles('modules/ttyd/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-ttyd-

      - name: Install ttyd build dependencies (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: vcpkg install libuv json-c libwebsockets getopt --triplet x64-windows-static

      - name: Build ttyd from source (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          cmake -B build-ttyd -S modules/ttyd \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ttyd --config Release
          mkdir -p build
          cp build-ttyd/Release/ttyd.exe build/ttyd.exe

      - name: Build Windows Go binaries
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          cd backend
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../build/1agents.exe ./cmd/backend
          cd ../modules/cc-connect/cmd/cc-connect
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }} -X main.commit=${{ github.sha }} -X main.buildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" -o ../../../../build/cc-connect.exe .

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-desktop-${{ matrix.os_name }}-${{ hashFiles('modules/HarnessKit/Cargo.lock') }}
          restore-keys: |
            cargo-desktop-${{ matrix.os_name }}-

      - name: Build HarnessKit frontend (embedded into hk CLI)
        shell: bash
        run: |
          cd modules/HarnessKit
          npm ci --ignore-scripts
          npm run build

      - name: Build HarnessKit CLI
        shell: bash
        run: |
          cargo build \
            --manifest-path modules/HarnessKit/Cargo.toml \
            --release \
            -p hk-cli
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            cp modules/HarnessKit/target/release/hk.exe build/hk.exe
          else
            cp modules/HarnessKit/target/release/hk build/hk
          fi

      - name: Build happy bundle
        shell: bash
        # Desktop may be offline at first run; pre-install happy-cli deps into the bundle.
        run: BUNDLE_NODE_MODULES=1 ./scripts/build-happy-bundle.sh

      - name: Setup Tauri resources
        shell: bash
        run: ./scripts/setup-resources.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri desktop application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Release ${{ needs.prepare.outputs.tag }}"
          releaseDraft: true
          prerelease: false

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v6

      - name: Download all archives and npm package artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Layout GitHub Release tarballs + fill npm packages from archives
        run: |
          set -euo pipefail
          # Collect tarballs (optional non-npm bypass + source of binaries for npm fill)
          find artifacts -name '1agents-*.tar.gz' -exec cp -n {} . \; || true
          ls -la 1agents-*.tar.gz

          # Prefer pre-filled npm package artifacts when present
          if find artifacts -type f -path '*/bin/1agents' | grep -q .; then
            echo "=== using pre-filled npm package artifacts ==="
            while IFS= read -r p; do
              # path like artifacts/.../core-linux-x64/bin/1agents
              rel="${p#artifacts/}"
              # find package root (directory containing package.json)
              d=$(dirname "$(dirname "$p")")
              name=$(basename "$d")
              case "$name" in
                core-*|cc-connect-*)
                  rm -rf "npm/packages/$name"
                  cp -a "$d" "npm/packages/$name"
                  ;;
              esac
            done < <(find artifacts -type f -path '*/bin/1agents' -o -type f -path '*/bin/cc-connect')
            for shared in web happy acpx acp-bridge cli cc-connect; do
              found=$(find artifacts -type d -name "$shared" | head -1 || true)
              if [ -n "$found" ] && [ -f "$found/package.json" ]; then
                rm -rf "npm/packages/$shared"
                cp -a "$found" "npm/packages/$shared"
              fi
            done
          fi

          # Always also fill from tarballs so every platform is present
          fill_from_tar() {
            local tarfile="$1" plat="$2"
            local tmp
            tmp=$(mktemp -d)
            tar -xzf "$tarfile" -C "$tmp"
            NPM_PLAT="$plat" \
              CORE_BIN_DIR="$tmp/bin" \
              WEB_DIST="$tmp/dist" \
              HAPPY_OUT="$tmp/bin" \
              ./scripts/npm-fill-packages.sh
            # happy-cli may live under bin/happy-cli in tarball
            if [ -d "$tmp/bin/happy-cli" ]; then
              HAPPY_OUT="$tmp/bin" NPM_PLAT="$plat" CORE_BIN_DIR="$tmp/bin" WEB_DIST="$tmp/dist" \
                ./scripts/npm-fill-packages.sh
            fi
            rm -rf "$tmp"
          }

          for t in 1agents-*-linux-amd64.tar.gz; do
            [ -f "$t" ] && fill_from_tar "$t" "linux-x64"
          done
          for t in 1agents-*-linux-arm64.tar.gz; do
            [ -f "$t" ] && fill_from_tar "$t" "linux-arm64"
          done
          for t in 1agents-*-darwin-arm64.tar.gz; do
            [ -f "$t" ] && fill_from_tar "$t" "darwin-arm64"
          done

          echo "=== npm/packages binaries ==="
          find npm/packages -path '*/bin/*' ! -name '.gitkeep' | sort

      - name: Download html-dist for frontend OTA payload
        uses: actions/download-artifact@v8
        with:
          name: html-dist
          path: html-dist

      - name: Build OTA frontend payload + root manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Frontend OTA tarball (top-level files, no outer dist/ prefix).
          # Prefer the dedicated html-dist artifact; fall back to extracting
          # dist/ from a backend tarball when the artifact is missing.
          # Canonical name: frontend-vYYYYMMDD-N.tar.gz (TAG already has leading v).
          FE_TGZ="frontend-${TAG}.tar.gz"
          if [ -f html-dist/index.html ]; then
            tar -czf "$FE_TGZ" -C html-dist .
            echo "=== frontend payload from html-dist artifact ==="
            ls -lh "$FE_TGZ"
          else
            echo "html-dist/index.html missing — trying backend tarball dist/"
            fe_src=""
            for cand in 1agents-${TAG}-linux-amd64.tar.gz \
                        1agents-${TAG}-linux-arm64.tar.gz \
                        1agents-${TAG}-darwin-arm64.tar.gz; do
              [ -f "$cand" ] && { fe_src="$cand"; break; }
            done
            if [ -n "$fe_src" ]; then
              rm -rf _fe && mkdir -p _fe
              tar -xzf "$fe_src" -C _fe
              dist_dir=""
              # Prefer release-pkg layout dist/index.html; never pick happy-cli/dist.
              if [ -f _fe/dist/index.html ]; then
                dist_dir="_fe/dist"
              else
                while IFS= read -r d; do
                  if [ -f "$d/index.html" ]; then dist_dir="$d"; break; fi
                done < <(find _fe -type d -name dist 2>/dev/null | sort)
              fi
              if [ -n "$dist_dir" ]; then
                tar -czf "$FE_TGZ" -C "$dist_dir" .
                echo "=== frontend payload from $fe_src ($dist_dir) ==="
                ls -lh "$FE_TGZ"
              else
                echo "WARN: no dist/index.html in $fe_src — frontend OTA entry will be empty"
              fi
            else
              echo "WARN: no backend tarball to derive frontend payload"
            fi
          fi

          # build-manifest.py accepts both versioned (GitHub asset names) and
          # unversioned tarballs; for GitHub it emits URLs using the actual basename.
          python3 scripts/build-manifest.py \
            --version "$TAG" \
            --artifacts . \
            --output manifest.json
          echo "=== OTA manifest ==="
          cat manifest.json
          # Fail the release if platforms are empty — OTA would be broken.
          python3 -c "
          import json, sys
          m = json.load(open('manifest.json'))
          plats = m.get('components', {}).get('backend', {}).get('platforms', {})
          if not plats:
              print('ERROR: manifest has no backend platforms', file=sys.stderr)
              sys.exit(1)
          print('platforms:', ', '.join(sorted(plats)))
          "

      - name: Create GitHub Release (tarballs optional bypass)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## npm (default install path)

            ```bash
            npm install -g @1agents/cli@${{ needs.prepare.outputs.npm_version }}
            ```

            Platform binaries ship as `@1agents/core-<plat>` etc. **directly on the npm registry**.
            These GitHub Release tarballs are an **optional non-npm bypass** (desktop/offline).

            See `docs/features/npm-package-split/prd.md`.
          files: |
            1agents-*.tar.gz
            frontend-*.tar.gz
            manifest.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Publish @1agents/* packages to npm registry
        env:
          # setup-node registry-url uses NODE_AUTH_TOKEN; our script also accepts NPM_TOKEN
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not set. Skipping npm publish (GitHub Release still created)."
            exit 0
          fi

          node scripts/npm-set-version.mjs "${{ needs.prepare.outputs.npm_version }}"

          # Sanity: cli has no embedded binaries; at least one core platform package has binaries
          if find npm/packages/cli -path '*/bin/*' ! -name '.gitkeep' 2>/dev/null | grep -q .; then
            echo "ERROR: @1agents/cli must not contain platform binaries" >&2
            exit 1
          fi
          if ! find npm/packages/core-* -path '*/bin/1agents' 2>/dev/null | grep -q .; then
            echo "ERROR: no core platform package contains bin/1agents — fill step failed" >&2
            find npm/packages -maxdepth 3 | head -80
            exit 1
          fi
          if [ ! -f npm/packages/acpx/dist/runtime.js ]; then
            echo "ERROR: npm/packages/acpx/dist/runtime.js missing — @1agents/acpx not filled (modules/1acp build)" >&2
            exit 1
          fi
          if ! grep -q 'onExitPlanMode\|onAskUserQuestion' npm/packages/acpx/dist/runtime.js npm/packages/acpx/dist/*.js 2>/dev/null; then
            # Grok host hooks live in live-checkpoint chunk; fail closed if neither is present.
            if ! grep -q '_x.ai/exit_plan_mode\|_x.ai/ask_user_question' npm/packages/acpx/dist/*.js 2>/dev/null; then
              echo "ERROR: @1agents/acpx dist lacks Grok host extensions — wrong/empty dist" >&2
              exit 1
            fi
          fi

          (cd npm/packages/cli && npm pack --dry-run --ignore-scripts 2>&1 | tail -5)

          ./scripts/npm-publish-all.sh

          echo "Published @1agents/* @${{ needs.prepare.outputs.npm_version }}"
          echo "Install: npm i -g @1agents/cli@${{ needs.prepare.outputs.npm_version }}"

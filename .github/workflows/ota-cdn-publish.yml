name: OTA CDN Publish

# After auto-release.yml finishes (it stays the canonical source and is
# untouched), mirror the OTA artifacts to Tencent Cloud COS so China clients
# fetch updates from the CDN instead of GitHub. Runs as a separate workflow so
# a slow/failed upload never blocks publishing.
#
# Trigger: workflow_run on auto-release completion — NOT `on: release`, because
# a release created by the built-in GITHUB_TOKEN (softprops/action-gh-release)
# does NOT emit a `release` event that can trigger other workflows (GitHub
# anti-recursion). workflow_run fires regardless and needs no PAT.
#
# Required repo secrets (skips cleanly if unset):
#   COS_SECRET_ID / COS_SECRET_KEY  — Tencent Cloud API credentials
#   COS_BUCKET                      — bucket name, e.g. 1agents-ota-1300000000
#   COS_ENDPOINT / COS_REGION       — optional; empty → COS global acceleration
#   OTA_CDN_BASE_URL                — public CDN base, e.g. https://ota.example.com
#                                     (manifest asset URLs become {base}/{tag}/{file})

on:
  workflow_run:
    workflows: ["auto-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish to CDN, e.g. v20260620-1'
        required: true

jobs:
  publish-cdn:
    runs-on: ubuntu-latest
    # On workflow_run, only proceed when auto-release actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag + gate on secrets
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          OTA_CDN_BASE_URL: ${{ secrets.OTA_CDN_BASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            # workflow_run: auto-release just published the newest release.
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

          if [ -z "$COS_SECRET_ID" ] || [ -z "$COS_BUCKET" ] || [ -z "$OTA_CDN_BASE_URL" ]; then
            echo "COS secrets not configured — skipping CDN publish."
            echo "Set COS_SECRET_ID/COS_SECRET_KEY/COS_BUCKET/COS_REGION/OTA_CDN_BASE_URL to enable."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download backend tarballs from the release
        if: steps.prep.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          mkdir -p _mirror
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern '1agents-*.tar.gz' \
            --dir _mirror
          echo "=== downloaded ===" && ls -lh _mirror

      - name: Stage artifacts and build CDN manifest
        if: steps.prep.outputs.go == 'true'
        env:
          TAG: ${{ steps.prep.outputs.tag }}
          OTA_CDN_BASE_URL: ${{ secrets.OTA_CDN_BASE_URL }}
        run: |
          # Strip the version segment so build-manifest.py's platform regex
          # matches; the version lives in the CDN URL path instead.
          mkdir -p _stage
          for f in _mirror/1agents-*.tar.gz; do
            base="$(basename "$f")"
            new="$(echo "$base" | sed "s/^1agents-${TAG}-/1agents-/")"
            cp "$f" "_stage/$new"
          done
          echo "=== staged ===" && ls -lh _stage

          # Frontend OTA payload: extract html/dist from a backend tarball and
          # repackage as frontend-v${TAG}.tar.gz (files at top level). This fills
          # manifest.components.frontend.{entry,integrity} (build-manifest.py's
          # find_frontend looks for exactly this name), enabling the self-hosted
          # server updater (1agents_server: scripts/server-h5-ota.sh) to pull the ~3MB app
          # bundle instead of a 50MB backend tarball. api/embed/ is intentionally
          # excluded — it changes rarely and the server updater preserves it
          # across swaps.
          fe_src=""
          for cand in _stage/1agents-linux-amd64.tar.gz _stage/1agents-linux-arm64.tar.gz _stage/1agents-darwin-arm64.tar.gz; do
            [ -f "$cand" ] && { fe_src="$cand"; break; }
          done
          if [ -n "$fe_src" ]; then
            rm -rf _fe && mkdir -p _fe
            tar -xzf "$fe_src" -C _fe
            dist_dir="$(find _fe -type d -name dist | head -1)"
            if [ -n "$dist_dir" ] && [ -f "$dist_dir/index.html" ]; then
              tar -czf "_stage/frontend-v${TAG}.tar.gz" -C "$dist_dir" .
              echo "=== frontend payload staged from $(basename "$fe_src") ===" && ls -lh "_stage/frontend-v${TAG}.tar.gz"
            else
              echo "WARN: dist/ with index.html not found in $fe_src — frontend payload skipped"
            fi
          else
            echo "WARN: no backend tarball to derive frontend payload — skipped"
          fi

          python3 scripts/build-manifest.py \
            --version "$TAG" \
            --artifacts _stage \
            --base-url "$OTA_CDN_BASE_URL" \
            --output _stage/manifest.json
          echo "=== CDN manifest ===" && cat _stage/manifest.json

      - name: Upload to COS + keep the latest 3 versions
        if: steps.prep.outputs.go == 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          # Optional: leave both unset to use COS global acceleration.
          COS_ENDPOINT: ${{ secrets.COS_ENDPOINT }}
          COS_REGION: ${{ secrets.COS_REGION }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          pip install -q "cos-python-sdk-v5>=1.9"
          python3 scripts/cos-publish.py "$TAG" _stage 3
